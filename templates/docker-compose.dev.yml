version: "3.9"
services:
  app:
    build: .
    container_name: todoapp-dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./:/app
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
