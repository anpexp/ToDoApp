version: "3.9"
services:
  app:
    image: ${IMAGE_NAME:-yourdockerhubuser/todoapp}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - /opt/todoapp/data/mongo:/data/db
